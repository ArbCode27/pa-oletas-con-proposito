<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <defs>
    <!-- Tira Frontal: De arriba-izquierda a abajo-derecha -->
    <linearGradient id="ribbonFront" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FF52A3" />
      <stop offset="25%" stop-color="#FF77B8" />
      <stop offset="50%" stop-color="#EF007E" />
      <stop offset="80%" stop-color="#D4006E" />
      <stop offset="100%" stop-color="#B3005B" />
    </linearGradient>

    <!-- Tira Trasera: De arriba-derecha a abajo-izquierda -->
    <linearGradient id="ribbonBack" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#FF52A3" />
      <stop offset="35%" stop-color="#E00578" />
      <stop offset="70%" stop-color="#C40065" />
      <stop offset="100%" stop-color="#99004E" />
    </linearGradient>

    <!-- Giro 3D interior del lazo en la parte superior derecha -->
    <linearGradient id="ribbonInner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C9006A" />
      <stop offset="50%" stop-color="#94004D" />
      <stop offset="100%" stop-color="#6E0038" />
    </linearGradient>

    <!-- Brillo satinado en la corona superior -->
    <linearGradient id="ribbonShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Sombra proyectada del cruce de cintas -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-3" dy="5" stdDeviation="5" flood-color="#3B001D" flood-opacity="0.45" />
    </filter>

    <!-- Sombra de apoyo en la base -->
    <filter id="ribbonFloor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Sombra suave de apoyo debajo del icono -->
  <ellipse cx="200" cy="485" rx="100" ry="12" fill="#000000" opacity="0.18" filter="url(#ribbonFloor)" />
  <ellipse cx="200" cy="485" rx="55" ry="6" fill="#000000" opacity="0.22" filter="url(#ribbonFloor)" />

  <!-- 1. Reverso / cara interna superior derecha (pliegue 3D) -->
  <path
    d="M200 65 C228 65 248 85 256 112 C262 135 254 165 238 198 C226 172 216 138 206 106 C202 92 198 78 200 65 Z"
    fill="url(#ribbonInner)"
  />

  <!-- 2. Tira trasera (Bucle derecho que desciende por detrás hacia la izquierda) -->
  <path
    d="M200 65 C172 65 146 86 146 125 C146 162 170 205 200 252 L106 372 L146 428 L230 300 C214 274 204 240 202 206 C200 152 234 114 200 65 Z"
    fill="url(#ribbonBack)"
  />

  <!-- 3. Tira frontal (Bucle superior que cruza por delante hacia abajo-derecha) -->
  <path
    d="M200 65 C168 65 146 88 146 135 C146 182 174 226 200 266 L294 386 L254 442 L172 322 C192 292 208 252 210 218 C212 158 232 108 200 65 Z"
    fill="url(#ribbonFront)"
    filter="url(#ribbonShadow)"
  />

  <!-- 4. Brillo satinado curvo superior -->
  <path
    d="M200 66 C176 66 156 84 152 118 C158 92 176 76 200 76 C224 76 242 92 248 118 C244 84 224 66 200 66 Z"
    fill="url(#ribbonShine)"
  />
</svg>
